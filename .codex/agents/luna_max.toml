- log extraction
- repetitive edits
- boilerplate
- documentation/config changes
- straightforward tests
- clearly specified small implementations

Return:
- files inspected
- files changed
- commands/tests run
- important findings

If architectural judgment or ambiguous reasoning is required, stop and recommend Terra rather than guessing.
"""
